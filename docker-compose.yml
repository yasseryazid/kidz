services:
  api:
    build:
      context: .
      dockerfile: docker/go/Dockerfile
    container_name: kidz-api
    volumes:
      - .:/app
    expose:
      - "6060"
    env_file:
      - .env
  nginx:
    image: nginx:1.27-alpine
    container_name: kidz-nginx
    depends_on:
      - api
    ports:
      - "6060:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
